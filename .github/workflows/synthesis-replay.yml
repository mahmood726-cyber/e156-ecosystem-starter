name: Synthesis source replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/synthesis_replay.py'
      - 'scripts/synthesis_rocrate.py'
      - 'scripts/check-synthesis-rocrate.py'
      - 'scripts/synthesis_preflight.py'
      - 'scripts/synthesis_intake_evidence.py'
      - 'scripts/synthesis_preflight_count_identity.py'
      - 'scripts/synthesis_preflight_root_dedup.py'
      - 'scripts/synthesis_case_state.py'
      - 'scripts/synthesis_capture_evidence.py'
      - 'scripts/synthesis_participant_evidence.py'
      - 'scripts/synthesis_v13_nma_preflight.py'
      - 'scripts/synthesis_five_journal_corrections.py'
      - 'tests/test_synthesis_replay.py'
      - 'tests/test_synthesis_rocrate.py'
      - 'tests/test_synthesis_capture_evidence.py'
      - 'examples/synthesis-replay-stepwise/**'
      - 'examples/synthesis-replay-strokewalk/**'
      - '.gitattributes'
      - 'requirements-ci.lock'
      - 'requirements-rocrate.lock'
      - 'schemas/rocrate-contexts.json'
      - '.github/workflows/synthesis-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Archived OA replay and provenance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Run replay and source-capture negative controls
        run: python -m pytest tests/test_synthesis_replay.py tests/test_synthesis_capture_evidence.py tests/test_synthesis_rocrate.py -q
      - name: Recompute the archived OA development example
        run: >-
          python scripts/synthesis_replay.py verify examples/synthesis-replay-stepwise
          --expected-sha256 c7fb904293fcf13ec542553b9667bfec51ca7c713d1183b418ec93b6cbb177d3
      - name: Recompute the archived report and registry link
        run: >-
          python scripts/synthesis_replay.py verify examples/synthesis-replay-strokewalk
          --expected-sha256 8ebe174bf7613830c5c919b989d8967c3f56d3ea5b742dd4a8b561293faf4533
      - name: Install hash-locked upstream profile validator
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-rocrate.lock
      - name: Validate real exports and reject broken provenance
        run: python scripts/check-synthesis-rocrate.py --output rocrate-validation.json
