# CI for e156-ecosystem-starter.
#
# Runs on every push and PR. Five jobs:
#   1. pester       -- PowerShell tests on Windows (install.ps1 helpers,
#                      redaction, supply-chain pinning, SHA gate)
#   2. bash-tests   -- bash tests on Ubuntu (install.sh helpers, redaction,
#                      pinning, dot-source hygiene)
#   3. python-tests -- pytest for portable Python helpers (push-portfolio
#                      dotted-dir skip rule, etc.)
#   4. lint         -- ShellCheck on .sh files; PSScriptAnalyzer on .ps1
#   5. link-check   -- lychee against docs/**/*.html so a broken cross-page
#                      anchor or dead external link fails CI before it
#                      reaches the Pages surface
#
# Bash tests do NOT pip-install Sentinel/Overmind in CI -- those live in
# separate repos with their own pipelines. We only verify wrapper logic.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show PowerShell + Pester versions
        shell: pwsh
        run: |
          $PSVersionTable | Out-String
          Get-Module -ListAvailable Pester | Select-Object Name, Version
      - name: Run Pester suites
        shell: pwsh
        run: |
          $files = @(
            'install\pester.tests.ps1',
            'bootstrap\pester.bat.tests.ps1',
            'scripts\pester.doctor-report.tests.ps1',
            'scripts\pester.install-sentinel.tests.ps1',
            'scripts\pester.install-e156-capsules.tests.ps1',
            'scripts\pester.install-extractor.tests.ps1',
            'scripts\pester.phase3.tests.ps1',
            'scripts\pester.phase4.tests.ps1',
            'scripts\pester.update.tests.ps1',
            'scripts\pester.handoff-locale.tests.ps1',
            'scripts\pester.install-long-term-plan.tests.ps1',
            'scripts\pester.install-meta-harness.tests.ps1'
          )
          # A green aggregate can conceal a missing suite or an all-skipped file.
          # Require every declared suite to exist, discover tests, and finish
          # without skipped, not-run, failed, or errored cases.
          $ErrorActionPreference = 'Stop'
          $missing = @($files | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            throw "Required Pester suite(s) missing: $($missing -join ', ')"
          }
          if (@($files | Select-Object -Unique).Count -ne $files.Count) {
            throw 'Duplicate required Pester suite path.'
          }
          for ($i = 0; $i -lt $files.Count; $i++) {
            $suite = $files[$i]
            $config = New-PesterConfiguration
            $config.Run.Path = @($suite)
            $config.Run.Exit = $false
            $config.Run.PassThru = $true
            $config.Output.Verbosity = 'Detailed'
            $config.TestResult.Enabled = $true
            $xmlPath = ('pester-results-{0:D2}.xml' -f $i)
          $config.TestResult.OutputPath = $xmlPath
            $config.TestResult.OutputFormat = 'NUnitXml'
            $result = Invoke-Pester -Configuration $config
            if ($null -eq $result) {
              throw "Pester returned no results for required suite: $suite"
            }
            foreach ($key in @('TotalCount', 'PassedCount', 'FailedCount', 'SkippedCount', 'NotRunCount')) {
              if ($null -eq $result.$key) {
                throw "Pester did not report $key for required suite: $suite"
              }
            }
            if ($result.TotalCount -lt 1 -or $result.FailedCount -ne 0 -or
                $result.SkippedCount -ne 0 -or $result.NotRunCount -ne 0 -or
                $result.PassedCount -ne $result.TotalCount) {
              throw "Incomplete Pester suite $suite (total=$($result.TotalCount); passed=$($result.PassedCount); failed=$($result.FailedCount); skipped=$($result.SkippedCount); not-run=$($result.NotRunCount))"
            }
            # Pester's in-memory counts are not proof that every individual
            # NUnit XML artifact was actually written for later inspection.
            if (-not (Test-Path -LiteralPath $xmlPath -PathType Leaf)) {
              throw "Required Pester XML missing for suite: $suite ($xmlPath)"
            }
            if ((Get-Item -LiteralPath $xmlPath).Length -le 0) {
              throw "Required Pester XML empty for suite: $suite ($xmlPath)"
            }
            Write-Host "Required Pester suite PASSED: $suite ($($result.PassedCount) tests)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-results
          path: pester-results-*.xml
          if-no-files-found: error

  bash-tests:
    name: Bash tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show bash version
        run: bash --version
      - name: Run bash test suite
        run: bash tests/test-install-sh.bash
      - name: Run handoff-locale bash tests
        run: bash tests/test-handoff-locale.bash

  python-tests:
    name: Python tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Run pytest
        run: python -m pytest tests/ -v

  meta-harness-unpack-windows:
    name: Meta-Harness archive installer (Windows Git Bash)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Run actual Bash installer and negative release cases
        run: python -m pytest tests/test_install_meta_harness.py -v

  hash-check:
    name: HASH files in sync with install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs/HASH.txt + docs/HASH-linux.txt
        run: bash scripts/regen-hashes.sh --check

  i18n-parity:
    name: i18n landing pages match English structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify <details> count parity across en/fr/pt/ar/ur
        run: bash scripts/check-i18n-parity.sh

  sentinel-rule-list-drift:
    name: Teaching 1-pager Sentinel list matches Sentinel repo
    runs-on: ubuntu-latest
    # Fetch the exact reviewed Sentinel revision; never skip this drift gate.
    # Update the SHA deliberately alongside the generated teaching page.
    steps:
      - uses: actions/checkout@v4
      - name: Verify auto-generated Sentinel list matches source
        env:
          SENTINEL_REPO: ${{ github.workspace }}/Sentinel
        run: |
          git init "$SENTINEL_REPO"
          git -C "$SENTINEL_REPO" remote add origin https://github.com/mahmood726-cyber/Sentinel.git
          git -C "$SENTINEL_REPO" fetch --depth 1 origin 97273997db160aee99d89af94fcc18bf621b3cb9
          git -C "$SENTINEL_REPO" checkout --detach FETCH_HEAD
          test "$(git -C "$SENTINEL_REPO" rev-parse HEAD)" = 97273997db160aee99d89af94fcc18bf621b3cb9
          bash scripts/regen-sentinel-rule-list.sh --check

  link-check:
    name: Pages link-check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lychee link checker
        # Pinned to v2 major; bump deliberately when changing anchor / fragment
        # behaviour. (P2-4 from 2026-04-27 review.)
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          # Anchor verification (--include-fragments) is what catches the
          # ../#install vs ../#troubleshooting class of bug. We restrict
          # to the docs/ tree so PR-time README markdown churn does not
          # noise the build.
          args: >-
            --no-progress
            --include-fragments
            --accept 200,206,403,429
            'docs/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Static analysis (ShellCheck + PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          # Lint our shipped .sh files. Don't fail the build on style-only
          # warnings (SC2034, SC2155); fail on real bugs.
          # Tests (tests/*.bash) are excluded -- harness uses ad-hoc patterns.
          shellcheck --severity=error --shell=bash \
            install/install.sh \
            scripts/install-sentinel.sh \
            scripts/install-extractor.sh \
            scripts/install-overmind.sh \
            scripts/install-projectindex.sh \
            scripts/install-long-term-plan.sh \
            scripts/install-meta-harness.sh \
            bootstrap/e156-setup.sh \
            docs/e156-setup.sh

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $allIssues = @()
          foreach ($d in 'install','scripts','bootstrap','docs') {
            if (Test-Path $d) {
              $allIssues += Invoke-ScriptAnalyzer -Path $d `
                -Recurse `
                -Severity Error `
                -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions
            }
          }
          if ($allIssues.Count -gt 0) {
            $allIssues | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($allIssues.Count) error-level issue(s)."
          }
          Write-Host "PSScriptAnalyzer: clean."
