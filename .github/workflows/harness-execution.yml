name: Harness execution and worker containment

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/harness_*.py'
      - 'scripts/bounded_native.py'
      - 'scripts/component_source.py'
      - 'scripts/synthesis_access_controls.py'
      - 'scripts/synthesis_matched_eval.py'
      - 'scripts/synthesis_study_preflight.py'
      - 'tests/test_synthesis_access_controls.py'
      - 'tests/test_synthesis_study_preflight.py'
      - 'tests/test_synthesis_matched_eval.py'
      - 'tests/test_harness_*.py'
      - 'tests/native_*checks.py'
      - 'benchmarks/harness-execution-*.json'
      - 'benchmarks/requirements-execution-windows.lock'
      - 'requirements-ci.lock'
      - '.github/workflows/harness-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution:
    name: Durable execution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Exercise synthetic execution, recovery and context contracts
        run: python -m pytest tests/test_harness_context.py tests/test_harness_derivation.py tests/test_harness_runtime.py tests/test_harness_trace.py tests/test_harness_progress.py tests/test_harness_execution_benchmark.py tests/test_harness_provider.py tests/test_harness_study_runner.py tests/test_harness_study_records.py tests/test_synthesis_access_controls.py tests/test_synthesis_study_preflight.py tests/test_synthesis_matched_eval.py -q --junitxml=execution-results.xml
      - name: Require actual study process controls
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          root = ET.parse('execution-results.xml').getroot()
          required = {'test_actual_child_watchdog_expires_without_parent_supervisor',
                      'test_actual_child_watchdog_covers_snapshot_validation',
                      'test_provider_child_owns_total_deadline_without_parent_supervisor',
                      'test_child_case_lock_fences_parent_and_stale_dispatch',
                      'test_finished_child_settled_after_parent_loss_without_dispatch',
                      'test_complete_prepare_execute_measure_freeze_mask_compare'}
          cases = [case for case in root.findall('.//testcase') if case.get('name') in required]
          if {case.get('name') for case in cases} != required or any(list(case) for case in cases):
              raise SystemExit('Required real-process study controls missing, skipped, or failed')
      - name: Require actual Windows rights boundary controls
        if: matrix.os == 'windows-2022'
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          root = ET.parse('execution-results.xml').getroot()
          required = {'test_manifest_cannot_be_its_own_decision_log',
                      'test_windows_junction_evidence_root_refused',
                      'test_windows_junction_manifest_and_log_are_refused'}
          cases = [case for case in root.findall('.//testcase') if case.get('name') in required]
          if {case.get('name') for case in cases} != required or any(list(case) for case in cases):
              raise SystemExit('Required Windows rights boundary controls missing, skipped, or failed')

  comparison:
    name: Native harness synthetic comparison (Windows)
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact Windows benchmark wheels
        run: 'python -m pip install --only-binary=:all: --require-hashes -r benchmarks/requirements-execution-windows.lock'
      - name: Execute all development cases with actual frameworks
        run: python -m scripts.harness_execution_benchmark --cases benchmarks/harness-execution-development.json --split development --output comparison.json
      - name: Require complete successful development execution
        shell: python
        run: |
          import json
          report = json.load(open('comparison.json', encoding='utf-8'))
          protocol = report['protocol']
          expected = len(report['cases']) * len(protocol['arms']) * protocol['repetitions']
          if len(report['rows']) != expected or not all(r['contract_satisfied'] for r in report['rows']):
              raise SystemExit('Missing, failed, or apparatus-error development observation')
      - name: Retain every attempted comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-harness-comparison
          path: comparison.json*
          if-no-files-found: error

  native-study:
    name: Native Pydantic development study (Windows)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Create isolated native environment
        run: python -m venv native-env
      - name: Install exact Windows native wheels
        run: 'native-env/Scripts/python.exe -m pip install --only-binary=:all: --require-hashes -r benchmarks/requirements-execution-windows.lock'
      - name: Verify source-only native loader contracts
        run: native-env/Scripts/python.exe -B -c "import sys, unittest; suite = unittest.defaultTestLoader.loadTestsFromName('tests.native_environment_checks'); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not (result.wasSuccessful() and result.testsRun >= 17 and not result.skipped))"
      - name: Exercise actual Pydantic Agent and recovery contracts
        run: native-env/Scripts/python.exe -B -c "import sys, unittest; suite = unittest.defaultTestLoader.loadTestsFromName('tests.native_pydantic_checks'); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not (result.wasSuccessful() and result.testsRun >= 18 and not result.skipped))"
      - name: Exercise isolated native study execution and immutable export
        run: native-env/Scripts/python.exe -B -c "import sys, unittest; suite = unittest.defaultTestLoader.loadTestsFromName('tests.native_study_checks'); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not (result.wasSuccessful() and result.testsRun >= 5 and not result.skipped))"

  worker:
    name: Actual Linux Docker containment
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      # Docker Official Python3.11-slim linux/amd64 manifest, retrieved2026-11-12.
      HARNESS_DOCKER_IMAGE: python@sha256:b701198cb708b68d9413ca67d6311bd97c9389a2c5fe4da0511fc652642366cd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Pull exact reviewed worker image
        run: docker pull "$HARNESS_DOCKER_IMAGE"
      - name: Exercise actual container boundaries and cleanup
        run: python -m pytest tests/test_harness_worker.py tests/test_harness_derivation.py -q --junitxml=worker-results.xml
      - name: Require actual containment tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('worker-results.xml').getroot()
          cases = root.findall('.//testcase')
          required = {'test_real_worker_readonly_network_credentials_and_limits',
                      'test_real_worker_derivation_and_recompute',
                      'test_real_worker_supervisor_status_and_proxy_boundary',
                      'test_real_worker_host_process_loss_expires_container',
                      'test_real_worker_output_overflow_refuses',
                      'test_real_worker_timeout_removes_its_container'}
          if not required.issubset({case.attrib.get('name') for case in cases}):
              raise SystemExit('Required real-container cases missing')
          if root.findall('.//skipped') or root.findall('.//failure') or root.findall('.//error'):
              raise SystemExit('Skipped or failed containment case')
          PY
