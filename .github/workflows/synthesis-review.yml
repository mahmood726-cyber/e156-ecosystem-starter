name: Persistent Synthesis audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/synthesis_*.py'
      - 'tests/test_synthesis_review_runner.py'
      - 'examples/synthesis-replay-*/**'
      - 'examples/synthesis-review-stepwise.json'
      - '.gitattributes'
      - 'requirements-ci.lock'
      - '.github/workflows/synthesis-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Persistent audit recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Verify advancement, invalidation, writer exclusion and abrupt process recovery
        run: python -m pytest tests/test_synthesis_review_runner.py -q
