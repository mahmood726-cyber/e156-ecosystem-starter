name: Synthesis decision records

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/synthesis_*.py'
      - 'tests/test_synthesis_adjudication.py'
      - 'examples/synthesis-replay-*/**'
      - 'examples/synthesis-adjudication-stepwise.json'
      - '.gitattributes'
      - 'requirements-ci.lock'
      - '.github/workflows/synthesis-adjudication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudication:
    name: Source-bound decision records (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Verify scoped decisions, disagreements and source invalidation
        run: python -m pytest tests/test_synthesis_adjudication.py -q
      - name: Verify the unreviewed OA example
        run: python scripts/synthesis_adjudication.py --dossier examples/synthesis-adjudication-stepwise.json --project stepwise-development --expected-sha256 184552927c4defaa8741a5c792ffa508522b05d63c3987eea66abde64811e114 --bundle stepwise=examples/synthesis-replay-stepwise
