name: Synthesis source and outgoing control contracts (synthetic)
on:
  pull_request:
    paths:
      - 'scripts/synthesis_access_controls.py'
      - 'tests/test_synthesis_access_controls.py'
      - '.github/workflows/synthesis-access-controls.yml'
  push:
    paths:
      - 'scripts/synthesis_access_controls.py'
      - 'tests/test_synthesis_access_controls.py'
      - '.github/workflows/synthesis-access-controls.yml'
permissions:
  contents: read
jobs:
  synthetic-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exercise source-rights and outgoing suppression contracts without I/O
        run: python3 -B -m unittest discover -s tests -p 'test_synthesis_access_controls.py' -v
