name: Synthesis source-trial pilot (synthetic and real-engine integration)
on:
  pull_request:
    paths:
      - 'scripts/synthesis_source_trial_view.py'
      - 'scripts/synthesis_paired_model_replay.py'
      - 'scripts/synthesis_trial_source_ledger.py'
      - 'tests/test_synthesis_source_trial_view.py'
      - 'tests/test_synthesis_real_engine.py'
      - 'docs/SYNTHESIS-SOURCE-TRIAL-PILOT.md'
      - 'docs/SYNTHESIS-PAIRED-OR-REPLAY.md'
      - '.github/workflows/synthesis-source-trial-pilot.yml'
  push:
    paths:
      - 'scripts/synthesis_source_trial_view.py'
      - 'scripts/synthesis_paired_model_replay.py'
      - 'scripts/synthesis_trial_source_ledger.py'
      - 'tests/test_synthesis_source_trial_view.py'
      - 'tests/test_synthesis_real_engine.py'
      - 'docs/SYNTHESIS-SOURCE-TRIAL-PILOT.md'
      - 'docs/SYNTHESIS-PAIRED-OR-REPLAY.md'
      - '.github/workflows/synthesis-source-trial-pilot.yml'
permissions:
  contents: read
jobs:
  offline-synthetic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Compile experimental module and tests
        run: python -B -m py_compile scripts/synthesis_source_trial_view.py scripts/synthesis_paired_model_replay.py scripts/synthesis_trial_source_ledger.py tests/test_synthesis_source_trial_view.py tests/test_synthesis_real_engine.py
      - name: Run synthetic-only source-trial regressions
        run: python -B -m unittest discover -s tests -p 'test_synthesis_source_trial_view.py' -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mahmood726-cyber/meta-starter-kit
          ref: 4156930cf2d1404870766fb821b045b671a7eff6
          path: .external/meta-starter-kit
          persist-credentials: false
      - name: Materialize canonical pinned engine bytes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          root = Path('.external/meta-starter-kit')
          # Windows checkout may convert LF to CRLF. Preserve the reviewed
          # Git object bytes; the integration still checks the exact blob hash.
          raw = subprocess.check_output(['git', '-C', str(root), 'cat-file', 'blob', 'HEAD:metakit/engine.py'])
          (root / 'metakit/engine.py').write_bytes(raw)
      - name: Real pinned meta-starter-kit engine; public paper-table negative control
        env:
          SYNTHESIS_PINNED_ENGINE_FILE: .external/meta-starter-kit/metakit/engine.py
        run: python -B -m unittest discover -s tests -p 'test_synthesis_real_engine.py' -v
