name: Research component installation

# Real locked-source canary on disposable runners, separate from fixture tests.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/component-lock.json"
      - "scripts/component_lock.py"
      - "scripts/component_source.py"
      - "scripts/rapidmeta_install.py"
      - "scripts/install-rapidmeta.*"
      - "scripts/install-aact-kit.*"
      - "scripts/aact_install.py"
      - "scripts/aact_canary.py"
      - "tests/test_component_install.py"
      - "tests/test_aact_component.py"
      - "requirements-aact-canary.lock"
      - ".github/workflows/research-component-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rapidmeta-source:
    name: Locked RapidMeta generator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Check lock and run isolated negative controls
        run: |
          python scripts/component_lock.py --check
          python -m pytest tests/test_component_install.py -q
      - name: Run real locked-source generator through Bash wrapper
        shell: bash
        run: |
          bash scripts/install-rapidmeta.sh --target "$RUNNER_TEMP/rapidmeta-locked" --session-only
      - name: Verify real source through PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-rapidmeta.ps1 -Target (Join-Path $env:RUNNER_TEMP 'rapidmeta-locked') -SkipClone -SessionOnly

  aact-source:
    name: Locked AACT local backends (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked canary and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock -r requirements-aact-canary.lock
      - name: Run isolated refusal controls
        run: python -m pytest tests/test_aact_component.py -q
      - name: Exercise real locked source through Bash
        shell: bash
        run: bash scripts/install-aact-kit.sh --target "$RUNNER_TEMP/aact-locked" --session-only --verify-runtime
      - name: Exercise real locked source through PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-aact-kit.ps1 -Target (Join-Path $env:RUNNER_TEMP 'aact-locked') -SkipClone -SessionOnly -VerifyRuntime
