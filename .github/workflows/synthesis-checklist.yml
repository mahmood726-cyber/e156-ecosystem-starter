name: Synthesis checklist and project memory contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/synthesis_*.py'
      - 'scripts/recall.py'
      - 'scripts/test_recall.py'
      - 'scripts/benchmark-memory.py'
      - 'tests/test_synthesis_checklist.py'
      - 'tests/test_memory*.py'
      - 'tests/test_recall_legacy.py'
      - 'docs/SYNTHESIS-*.md'
      - 'examples/synthesis-replay-*/**'
      - 'requirements-ci.lock'
      - '.github/workflows/synthesis-checklist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checklist:
    name: Checklist records and memory isolation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Check complete inventories, source drift and project ownership
        run: python -m pytest tests/test_synthesis_checklist.py tests/test_memory_origin.py tests/test_memory_contract.py tests/test_recall_legacy.py -q
