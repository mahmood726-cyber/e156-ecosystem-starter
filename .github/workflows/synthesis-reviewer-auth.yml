name: Reviewer authorization workflow

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/synthesis_*.py'
      - 'scripts/requirements-signing.lock'
      - 'scripts/component-lock.json'
      - 'requirements-ci.lock'
      - 'tests/test_synthesis_reviewer_workflow.py'
      - 'examples/synthesis-replay-*/**'
      - '.github/workflows/synthesis-reviewer-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer:
    name: Reviewer authorization and recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked signing and test dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-ci.lock -r scripts/requirements-signing.lock
      - name: Read existing Overmind source lock
        id: lock
        shell: python
        run: |
          import json, os
          from pathlib import Path
          commit = json.loads(Path('scripts/component-lock.json').read_text())['components']['overmind']['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('overmind=' + commit + '\n')
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mahmood726-cyber/overmind
          ref: ${{ steps.lock.outputs.overmind }}
          path: .reviewer-overmind
          persist-credentials: false
      - name: Require signer and run authorization and process recovery controls
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          source = str(Path('.reviewer-overmind').resolve())
          os.environ['PYTHONPATH'] = source
          sys.path.insert(0, source)
          from overmind.verification.signers import Ed25519Signer
          import cryptography
          from nacl.bindings import crypto_core_ed25519_is_valid_point
          subprocess.run([sys.executable, '-m', 'pytest', 'tests/test_synthesis_reviewer_workflow.py', '-q'], check=True, timeout=300)
