# requirements-ci.lock -- hash-pinned install for the python-tests CI job.
# LOCK_VERSION = 1.0.0
#
# Covers pytest + every transitive runtime dependency for CPython 3.11
# (ubuntu-latest in CI). All five Linux deps are pure-Python
# py3-none-any wheels, so the same hashes also hold on Windows/macOS.
# colorama is only pulled in on win32 (pytest's own marker); it is
# listed here so a local Windows opt-in also installs under
# --require-hashes.
#
# Hashes are sha256 of the exact wheels fetched with
#   pip download pytest --python-version 3.11 \
#     --platform manylinux2014_x86_64 --implementation cp \
#     --only-binary=:all: -d <dir>
# then sha256sum <dir>/*.whl. Never hand-edit a hash; re-download.
# Guarded by tests/test_ci_lock.py.
#
# Install: python -m pip install --require-hashes -r requirements-ci.lock
